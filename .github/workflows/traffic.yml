# Synthetic visitors for the live store (traffic/run.ts).
#
# Primary trigger: an hourly call from cron-job.org to the workflow_dispatch
# API (GitHub's own schedule below is best effort and often skips runs, so it
# is only a backup). The call uses a fine-grained token owned by Arthur with
# access to this repository only and Actions: read and write; it expires
# 2027-09-30 and must be renewed before then. The token lives only in
# cron-job.org, never in this repository.
#
# Scheduled runs only happen when the repository variable TRAFFIC_ENABLED is
# "true" (Settings → Secrets and variables → Actions → Variables). Manual runs
# (Actions → Synthetic traffic → Run workflow) always work.
#
# Visitor profiles (cookies, carts) and the ground-truth logs are kept on the
# `traffic-data` branch, so returning visitors and the history survive between
# runs. Vercel deployments for that branch are disabled in vercel.json.

name: Synthetic traffic

on:
  schedule:
    # Hourly. Each run sends the sessions the acquisition model expects for the
    # time since the previous run (traffic/volume.ts), so a delayed run just
    # sends a bigger batch (up to 3 hours' worth).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      sessions:
        description: "Number of sessions (leave empty to follow the acquisition model)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: synthetic-traffic
  cancel-in-progress: false

jobs:
  traffic:
    if: github.event_name == 'workflow_dispatch' || vars.TRAFFIC_ENABLED == 'true'
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19; keep a known-good
    # image for Playwright's browser dependencies until it is verified there.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check out the traffic-data branch
        run: |
          git config user.name "verdian-traffic-bot"
          git config user.email "verdian-traffic-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin traffic-data >/dev/null; then
            git fetch --depth 1 origin traffic-data:traffic-data
            git worktree add traffic-data traffic-data
          else
            git worktree add --orphan -b traffic-data traffic-data
          fi

      - name: Run visitors
        env:
          TRAFFIC_STATE_DIR: traffic-data
          SESSIONS: ${{ inputs.sessions }}
        run: |
          ARGS=""
          if [[ "$SESSIONS" =~ ^[0-9]+$ ]]; then ARGS="--sessions $SESSIONS"; fi
          npm run traffic -- $ARGS

      - name: Save visitors and logs
        if: always()
        working-directory: traffic-data
        run: |
          cp ../vercel.json .
          mkdir -p hub && cp ../hub/vercel.json hub/vercel.json
          cp ../traffic/DATA_BRANCH.md README.md
          git add -A
          git commit -m "Traffic run $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin traffic-data
